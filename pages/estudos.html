<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estuda+ | Meus estudos</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header>

    <div class="logo">
        Estuda<span>+</span>
    </div>

    <nav>
        <a href="../index.html">Início</a>
        <a href="biblioteca.html">Biblioteca</a>
        <a href="estudos.html" class="active">Meus estudos</a>
        <a href="perfil.html">Perfil</a>
    </nav>

</header>

<main class="container">

    <section class="page-header">

        <h1>Meus estudos</h1>

        <p>Organize seus conteúdos e acompanhe seu progresso.</p>

    </section>

    <div class="study-header">

        <div>
            <h2>Prova de Biologia</h2>
            <p>20 de agosto de 2026</p>
        </div>

        <button class="btn">
            + Nova lista
        </button>

    </div>

    <div class="progress">

        <div class="progress-info">
            <span>Progresso</span>
            <strong>60%</strong>
        </div>

        <div class="progress-bar">
            <div style="width: 60%;"></div>
        </div>

    </div>

    <div class="study-list">

        <label>
            <input type="checkbox" checked>
            Revisar células
        </label>

        <label>
            <input type="checkbox" checked>
            Estudar mitose
        </label>

        <label>
            <input type="checkbox">
            Estudar meiose
        </label>

        <label>
            <input type="checkbox">
            Fazer exercícios
        </label>

    </div>

</main>

</body>
