<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estuda+ | Criar conta</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="auth-container">

    <div class="auth-box">

        <a href="../index.html" class="logo">
            Estuda<span>+</span>
        </a>

        <h1>Crie sua conta</h1>

        <p>Comece a organizar seus estudos.</p>

        <form>

            <label>Nome completo</label>

            <input
                type="text"
                placeholder="Digite seu nome"
                required
            >

            <label>E-mail</label>

            <input
                type="email"
                placeholder="seu@email.com"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                placeholder="Crie uma senha"
                required
            >

            <label>Série/Ano</label>

            <select required>
                <option value="">Selecione</option>
                <option>8º ano</option>
                <option>9º ano</option>
                <option>1º ano do Ensino Médio</option>
                <option>2º ano do Ensino Médio</option>
                <option>3º ano do Ensino Médio</option>
            </select>

            <label>Matérias de interesse</label>

            <div class="checkbox-group">

                <label>
                    <input type="checkbox">
                    Matemática
                </label>

                <label>
                    <input type="checkbox">
                    Português
                </label>

                <label>
                    <input type="checkbox">
                    Biologia
                </label>

                <label>
                    <input type="checkbox">
                    História
                </label>

            </div>

            <button class="btn full">
                Criar conta
            </button>

        </form>

        <p class="auth-footer">
            Já possui uma conta?
            <a href="login.html">Entrar</a>
        </p>

    </div>

</div>

</body>
</html>
